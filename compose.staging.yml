services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleartrade_staging
      POSTGRES_USER: cleartrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD through secret management}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cleartrade -d cleartrade_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: ${CLEARTRADE_IMAGE:?set immutable image reference}
    command: ["npm","run","migrate:deploy"]
    env_file: .env.staging
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  web:
    image: ${CLEARTRADE_IMAGE:?set immutable image reference}
    env_file: .env.staging
    command: ["npm","start"]
    ports: ["3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    image: ${CLEARTRADE_IMAGE:?set immutable image reference}
    env_file: .env.staging
    command: ["npm","run","worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 10m
volumes:
  staging-postgres:
