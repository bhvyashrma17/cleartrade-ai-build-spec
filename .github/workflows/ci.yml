name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleartrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cleartrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cleartrade_test
      # prisma/schema.prisma declares `directUrl = env("DIRECT_DATABASE_URL")`, so `prisma validate`
      # fails without it. Every CI run before this line failed at that step and never reached
      # typecheck, lint, tests or build. Same throwaway CI database; the test harness re-points
      # both URLs at its own disposable schema (tests/global-setup.ts).
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cleartrade_test
      AUTH_SECRET: ci-only-not-a-production-secret
      COMTRADE_CLIENT: mock
      DISCOVERY_ENGINE: warehouse
      IMPORT_BUYER_REF_SECRET: ci-only-buyer-reference-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t cleartrade:${{ github.sha }} .
