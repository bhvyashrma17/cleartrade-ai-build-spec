name: Prepare staging release
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag
        required: true
jobs:
  artifact:
    environment: staging
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cleartrade:${{ inputs.image_tag }}
          outputs: type=oci,dest=/tmp/cleartrade-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cleartrade-${{ inputs.image_tag }}
          path: /tmp/cleartrade-image.tar
          retention-days: 7
      - run: echo "Artifact prepared. Deployment and migrate steps require explicit staging operator approval."
